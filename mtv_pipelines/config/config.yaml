# Operator name
operator_name: "mtv-operator"

# Versions that are lower than cutoff will not be processed by automation
mtv_cutoff_version: "2.10.5"

# First MTV version that has CPE label
# CPEs started with MTV 2.9.5 (https://github.com/kubev2v/forklift/commit/b2ba256c97a03ad47fb3717a50f92397b6b4a297)
mtv_cpe_version_init: "2.9.5"

# Storage offload copyoffload Jenkins jobs: MTV x.y -> lab cluster API
# password_env: env var with kubeadmin password (default: STORAGE_OFFLOAD_CLUSTER_EDGE112)
storage_offload_clusters:
  "2.11":
    custom_cluster_name: "ocp-edge112"
    ocp_api_url: "https://api.ocp-edge112-0.lab.eng.tlv2.redhat.com:6443"
    ocp_version: "4.20"
    password_env: "STORAGE_OFFLOAD_CLUSTER_EDGE112"
  "2.12":
    custom_cluster_name: "ocp-edge113"
    ocp_api_url: "https://api.ocp-edge113-0.lab.eng.tlv2.redhat.com:6443"
    ocp_version: "4.21"
    password_env: "STORAGE_OFFLOAD_CLUSTER_EDGE113"

# Cluster to OCP version mapping
# if you want to disable CI for some OCP version, use "none"
#
# WORKFLOW: Before widening a release's OCP range (the OCP_VERSIONS high
# endpoint in a repo's build/release.conf, e.g. v4.22-v5.0 -> v4.22-v5.1),
# add the new OCP version here first (as "none" if it isn't shipping yet).
# bundle.py force-includes range endpoints in bundle.ocps even when they
# aren't listed here, so an unmapped endpoint becomes ocps[0]/ocps[1] and
# the Jenkins trigger (wrappers/jenkins.py get_*_args) raises ValueError on
# the absent key, which is uncaught and crashes the pipeline. An explicit
# "none" is skipped gracefully; an absent key is not.
cluster_mappings:
  "5.0": "qemtv-01"
  "4.23": "none"
  "4.22": "qemtv-03"
  "4.21": "qemtv-04"
  "4.20": "none"

# Override for the MTV version an upgrade job upgrades FROM, keyed by MTV X.Y.
# Only needed when it can't be derived from the release semver, i.e. a major
# cutover (5.0 has no 5.-1 / 5.0 predecessor, so it upgrades from 2.12).
upgrade_from_versions:
  "5.0": "2.12"

# Cluster to OCP version mapping for UI tests
ui_cluster_mapping:
  "qemtv-09": "none"

# Current MTV versions (not used for anything yet)
versions:
  "main": "5.0.0"
  "release-2.12": "2.12.6"
  "release-2.11": "2.11.7"
  "release-2.10": "2.10.3"
  "release-2.9": "2.9.7"
  "release-2.8": "2.8.9"

# Used for tracking the "konflux enabled" branches
branches:
  - "main"
  - "release-2.12"
  - "release-2.11"
  - "release-2.10"
  - "release-2.9"
  - "release-2.8"

# MTV FBC repository url
fbc_repo: "https://github.com/kubev2v/mtv-fbc"

# MTV automation settings
git_name: "MTV Bot - IIB Automation"
git_email: "mtv-automation@redhat.com"
git_label: "automation"

# FBC fragment image URL template
fbc_component_url: "quay.io/redhat-user-workloads/rh-mtv-1-tenant/forklift-fbc-\
  prod-{ocp}:on-pr-{commit}"

# FBC component konflux name template
fbc_component_name: "forklift-fbc-comp-prod-{ocp}"

# Image registriy namespaces
dev_preview_namespace: "mtv-candidate"
release_namespace: "migration-toolkit-virtualization"

# Arbitrary number of commits for history
# Assuming that there will never be more than 200 IIB builds for version
iib_max_commits: 200

# Commit message character limit of what is shown in slack
commit_character_limit: 50

# Maximum retries for FBC PR check retries
fbc_pr_max_retries: 3

# How long to wait for before requesting data from the FBC PR
fbc_pr_refresh_seconds: 120

