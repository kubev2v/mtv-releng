# Operator name
operator_name: "mtv-operator"

# Versions that are lower than cutoff will not be processed by automation
mtv_cutoff_version: "2.10.5"

# First MTV version that has CPE label
# CPEs started with MTV 2.9.5 (https://github.com/kubev2v/forklift/commit/b2ba256c97a03ad47fb3717a50f92397b6b4a297)
mtv_cpe_version_init: "2.9.5"

# Storage offload copyoffload Jenkins jobs: MTV x.y -> lab cluster API
# password_env: env var with kubeadmin password (default: STORAGE_OFFLOAD_CLUSTER_EDGE112)
storage_offload_clusters:
  "2.11":
    custom_cluster_name: "ocp-edge112"
    ocp_api_url: "https://api.ocp-edge112-0.lab.eng.tlv2.redhat.com:6443"
    ocp_version: "4.20"
    password_env: "STORAGE_OFFLOAD_CLUSTER_EDGE112"
  "2.12":
    custom_cluster_name: "ocp-edge113"
    ocp_api_url: "https://api.ocp-edge113-0.lab.eng.tlv2.redhat.com:6443"
    ocp_version: "4.21"
    password_env: "STORAGE_OFFLOAD_CLUSTER_EDGE113"

# Saturday tier1 Jenkins jobs: MTV x.y -> dedicated OCP (not bundle max).
# Job name is mtv-{xy}-ocp-{ocp_version}-test-tier1.
# Pointer file is written by automatic_iib after Konflux FBC checks pass.
latest_iib_state_path: "/app/data/latest_iib.json"
tier1_jobs:
  "2.12":
    ocp_version: "4.22"
  "5.0":
    ocp_version: "5.0"

# Cluster to OCP version mapping
# if you want to disable CI for some OCP version, use "none"
#
# WORKFLOW: Before widening a release's OCP range (the OCP_VERSIONS high
# endpoint in a repo's build/release.conf, e.g. v4.22-v5.0 -> v4.22-v5.1),
# add the new OCP version here first (as "none" if it isn't shipping yet).
# bundle.py force-includes range endpoints in bundle.ocps even when they
# aren't listed here, so an unmapped endpoint becomes ocps[0]/ocps[1] and
# the Jenkins trigger (wrappers/jenkins.py get_*_args) raises ValueError on
# the absent key, which is uncaught and crashes the pipeline. An explicit
# "none" is skipped gracefully; an absent key is not.
cluster_mappings:
  "5.1": "none"
  "5.0": "qemtv-01"
  "4.23": "none"
  "4.22": "qemtv-03"
  "4.21": "qemtv-04"
  "4.20": "qemtvd-06"
  "4.19": "nocluster"
  "4.18": "nocluster"

# Override for the MTV version an upgrade job upgrades FROM, keyed by MTV X.Y.
# Only needed when it can't be derived from the release semver, i.e. a major
# cutover (5.0 has no 5.-1 / 5.0 predecessor, so it upgrades from 2.12).
upgrade_from_versions:
  "5.0": "2.12"

# Cluster to OCP version mapping for UI tests
ui_cluster_mapping:
  "qemtv-09": "none"

# Current MTV versions (not used for anything yet)
versions:
  "main": "5.1.0"
  "release-5.0": "5.0.0"
  "release-2.12": "2.12.6"
  "release-2.11": "2.11.7"
  "release-2.10": "2.10.3"
  "release-2.9": "2.9.7"
  "release-2.8": "2.8.9"

# Used for tracking the "konflux enabled" branches
branches:
  - "main"
  - "release-5.0"
  - "release-2.12"
  - "release-2.11"
  - "release-2.10"
  - "release-2.9"
  - "release-2.8"

# MTV FBC repository url
fbc_repo: "https://github.com/kubev2v/mtv-fbc"

# MTV automation settings
git_name: "MTV Bot - IIB Automation"
git_email: "mtv-automation@redhat.com"
git_label: "automation"

# FBC fragment image URL template
fbc_component_url: "quay.io/redhat-user-workloads/rh-mtv-1-tenant/forklift-fbc-\
  prod-{ocp}:on-pr-{commit}"

# FBC component konflux name template
fbc_component_name: "forklift-fbc-comp-prod-{ocp}"

# Image registriy namespaces
dev_preview_namespace: "mtv-candidate"
release_namespace: "migration-toolkit-virtualization"

# Arbitrary number of commits for history
# Assuming that there will never be more than 200 IIB builds for version
iib_max_commits: 200

# Commit message character limit of what is shown in slack
commit_character_limit: 50

# Maximum retries for FBC PR check retries
fbc_pr_max_retries: 3

# How long to wait for before requesting data from the FBC PR
fbc_pr_refresh_seconds: 60

# Slack API
slack_api: "https://slack.com/api/"

# Slack channel to send build info to
slack_builds_channel: "C09DS44AQ65" # mtv-builds "C09DS44AQ65" # solenoci-test "C09BUM6ATBR"

# Slack channel to send the errors to
slack_errors_channel: "C09DRKZRQ4U"

# slack users to tag on CI failure
slack_failure_mentions:
  - "U04NPAUEAR1|solenoci"
  - "U018XG9RSP7|myakove"
  - "U03SLKWH0DR|mkrcmari"
  - "S0AKBSL1Y9L|ic-mtv" # User groups have different slack api tagging mechanism, for now it's hardcoded in slack.py

# Templates direcotry
templates_dir: "project/templates"

# Jira
jira_issues: "https://redhat.atlassian.net/"

# Jira "fixed-in-build" automation webhook (endpoint only; the token lives in the
# JIRA_FIXED_IN_BUILD_TOKEN env var and is sent as the X-Automation-Webhook-Token header)
jira_fixed_in_build_webhook_url: "https://api-private.atlassian.com/automation/webhooks/jira/a/ec74d716-af36-4b3c-950f-f79213d08f71/01a02036-1874-7319-849b-ad618e6a8b19"

# Root cert path inside the container
root_cert_path: "/app/root.pem"

# Jenkins url
jenkins_url: "https://jenkins-csb-mtv-qe-main.dno.corp.redhat.com"

# Jenkins wait refresh interval
jenkins_wait_refresh_seconds: 60

# Jenkins analyzer URL
jenkins_analyzer_url: "https://rootcoz-mtv-team.apps.cnv2.engineering.redhat.com"

# Database path (SQLite)
db_path: "sqlite:////app/data/mtv.db"

# Allowed jira project keys, used for slack message
allowed_project_keys:
  - "MTV"
  - "RHEL"
  - "KONFLUX"
  - "ECOPROJECT"
  - "CNV"
  - "KFLUXSPRT"

# Path to the version config file within each origin repository
release_conf_path: "build/release.conf"

# Branching pipeline: bundle images.conf (forklift only), retargeted at code freeze
images_conf_path: "build/forklift-operator-bundle/images.conf"

# Marker replaced by the version at code-freeze / stream-add time
# (e.g. "dev-preview" -> "2-11"), used across .tekton, release manifests, and RPAs.
dev_preview_marker: "dev-preview"

# branching pipeline: per-origin name of the global-version key in build/release.conf
release_conf_version_keys:
  forklift: "MTV_VERSION"
  forklift-console-plugin: "RVERSION"
  forklift-must-gather: "VERSION"

# Network/subprocess timeouts (seconds)
timeouts:
  http_seconds: 30
  oc_command_seconds: 120
  gitlab_mr_connect_seconds: 10
  gitlab_mr_read_seconds: 60
  build_single_seconds: 600
  tox_seconds: 900

# Konflux OpenShift clusters for `oc login` (mirrors scripts' ensure_oc_login).
# bundle_sync queries releases/snapshots on the service cluster (rh-mtv-1).
konflux_clusters:
  service:
    server: "https://api.stone-prd-rh01.pg1f.p1.openshiftapps.com:6443"
    token_env: "KONFLUX_SERVICE_TOKEN"
    namespace: "rh-mtv-1-tenant"
  btrfs:
    server: "https://api.stone-prod-p02.hjvn.p1.openshiftapps.com:6443"
    token_env: "KONFLUX_BTRFS_TOKEN"
    namespace: "rh-mtv-btrfs-tenant"

# btrfs_sync pipeline: public <-> internal forklift mirror settings
btrfs_sync:
  public_repo: "https://github.com/kubev2v/forklift.git"
  internal_repo: "https://gitlab.cee.redhat.com/mtv/forklift.git"
  fetch_depth: 50
  # git settings that make large-repo fetches more reliable (see PR #53)
  large_repo_git_config:
    http.postBuffer: "524288000"
    http.maxRequestBuffer: "100M"
    core.preloadindex: "true"
    core.fscache: "true"
    gc.auto: "256"

# bundle_sync pipeline: Containerfile-downstream SHA sync + virt-v2v-int source
bundle_sync:
  containerfile_base_url: "https://raw.githubusercontent.com/kubev2v/forklift"
  containerfile_path: "build/forklift-operator-bundle/Containerfile-downstream"
  target_repo: "kubev2v/forklift"
  target_repo_url: "https://github.com/kubev2v/forklift.git"
  release_target: "stage"
  pr_title: "chore(automation): Bundle SHA reference update for {version}"
  # virt-v2v-int image source (built internally, not in the Konflux snapshot)
  quay_tag_api: "https://quay.io/api/v1/repository/{repo_path}/tag/"
  virt_v2v_int_repo_path: "redhat-user-workloads/rh-mtv-btrfs-tenant/\
    forklift-operator-int-{version}/virt-v2v-int-{version}"

# konflux_stream pipeline: konflux-release-data repo + tenant paths
konflux_stream:
  host: "https://gitlab.cee.redhat.com"
  project_path: "releng/konflux-release-data"
  stream_branch: "mtv_add_stream"
  mr_target_branch: "main"
  prod_operator_dir: "tenants-config/cluster/stone-prd-rh01/tenants/\
    rh-mtv-1-tenant/operator"
  btrfs_streams: "tenants-config/cluster/stone-prod-p02/tenants/\
    rh-mtv-btrfs-tenant/streams.yaml"
  build_single_script: "tenants-config/build-single.sh"
  # Per-tenant ReleasePlanAdmission dir + filename prefix, built via build_single_script
  tenants:
    - build_name: "rh-mtv-1"
      rpa_dir: "config/stone-prd-rh01.pg1f.p1/product/\
        ReleasePlanAdmission/rh-mtv-1"
      rpa_prefix: "forklift-operator-rpa"
    - build_name: "rh-mtv-btrfs"
      rpa_dir: "config/stone-prod-p02.hjvn.p1/product/\
        ReleasePlanAdmission/rh-mtv-btrfs"
      rpa_prefix: "forklift-operator-int-rpa"

# Forklift "component" repositories
repositories:
  forklift: "https://github.com/kubev2v/forklift"
  forklift-console-plugin: "https://github.com/kubev2v/forklift-console-plugin"
  forklift-must-gather: "https://github.com/kubev2v/forklift-must-gather"
  # forklift-int: "https://gitlab.cee.redhat.com/mtv/forklift" # don't use internal git because it needs auth

  # Raw mappings
raw_mappings:
  forklift: "https://raw.githubusercontent.com/kubev2v/forklift/refs/heads/{branc\
    h}/build/release.conf"
  forklift-console-plugin: "https://raw.githubusercontent.com/kubev2v/forklift-co\
    nsole-plugin/refs/heads/{branch}/build/release.conf"
  forklift-must-gather: "https://raw.githubusercontent.com/kubev2v/forklift-must-\
    gather/refs/heads/{branch}/build/release.conf"
  forklift-int: "https://gitlab.cee.redhat.com/mtv/forklift/-/raw/{branch}/build/\
    release.conf"

# Component mappings
# mapping key = Downstream name of the component (e.g. image repository in comet)
# upstream = Upstream name of the component (e.g. image repository in konflux)
# origin = git repository URL mappings (from "repositories" config setting)
# arg = Containerfile-downstream ARG name (used by bundle_sync; mirrors
#       scripts/component_mappings.conf). Omit for the bundle itself (no ARG).
cmp_mappings:
  mtv-controller-rhel9:
    upstream: "forklift-controller"
    origin: "forklift"
    arg: "CONTROLLER_IMAGE"

  mtv-must-gather-rhel9:
    upstream: "forklift-must-gather"
    origin: "forklift-must-gather"
    arg: "MUST_GATHER_IMAGE"

  mtv-must-gather-rhel8:
    upstream: "forklift-must-gather"
    origin: "forklift-must-gather"
    arg: "MUST_GATHER_IMAGE"

  mtv-validation-rhel9:
    upstream: "validation"
    origin: "forklift"
    arg: "VALIDATION_IMAGE"

  mtv-api-rhel9:
    upstream: "forklift-api"
    origin: "forklift"
    arg: "API_IMAGE"

  mtv-populator-controller-rhel9:
    upstream: "populator-controller"
    origin: "forklift"
    arg: "POPULATOR_CONTROLLER_IMAGE"

  mtv-rhv-populator-rhel8:
    upstream: "ovirt-populator"
    origin: "forklift"
    arg: "OVIRT_POPULATOR_IMAGE"

  mtv-virt-v2v-rhel9:
    upstream: "virt-v2v-rhel9"
    origin: "forklift"
    arg: "VIRT_V2V_IMAGE_RHEL9"

  mtv-openstack-populator-rhel9:
    upstream: "openstack-populator"
    origin: "forklift"
    arg: "OPENSTACK_POPULATOR_IMAGE"

  mtv-console-plugin-rhel9:
    upstream: "forklift-console-plugin"
    origin: "forklift-console-plugin"
    arg: "UI_PLUGIN_IMAGE"

  mtv-ova-provider-server-rhel9:
    upstream: "ova-provider-server"
    origin: "forklift"
    arg: "OVA_PROVIDER_SERVER_IMAGE"

  mtv-vsphere-copy-offload-populator-rhel9:
    upstream: "vsphere-copy-offload-populator"
    origin: "forklift"
    arg: "VSPHERE_COPY_OFFLOAD_POPULATOR_IMAGE"

  mtv-vsphere-xcopy-volume-populator-rhel9:
    upstream: "vsphere-xcopy-volume-populator"
    origin: "forklift"
    arg: "VSPHERE_XCOPY_VOLUME_POPULATOR_IMAGE"

  mtv-rhel9-operator:
    upstream: "forklift-operator"
    origin: "forklift"
    arg: "OPERATOR_IMAGE"

  mtv-operator-bundle:
    upstream: "forklift-operator-bundle"
    origin: "forklift"

  mtv-cli-download-rhel9:
    upstream: "forklift-cli-download"
    origin: "forklift"
    arg: "CLI_DOWNLOAD_IMAGE"

  mtv-ova-proxy-rhel9:
    upstream: "forklift-ova-proxy"
    origin: "forklift"
    arg: "OVA_PROXY_IMAGE"

  mtv-virt-v2v-rhel10:
    upstream: "virt-v2v"
    origin: "forklift" # use public git because internal breaks auth
    arg: "VIRT_V2V_IMAGE"

  mtv-hyperv-provider-server-rhel9:
    upstream: "hyperv-provider-server"
    origin: "forklift"
    arg: "HYPERV_PROVIDER_SERVER_IMAGE"

  mtv-deep-inspection-rhel10:
    upstream: "deep-inspection"
    origin: "forklift"
    arg: "DEEP_INSPECTION_IMAGE"

  mtv-deep-inspection-rhel9:
    upstream: "deep-inspection-rhel9"
    origin: "forklift"
    arg: "DEEP_INSPECTION_IMAGE_RHEL9"
