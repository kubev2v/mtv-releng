  - "RHEL"
  - "KONFLUX"
  - "ECOPROJECT"
  - "CNV"
  - "KFLUXSPRT"

# Path to the version config file within each origin repository
release_conf_path: "build/release.conf"

# Forklift "component" repositories
repositories:
  forklift: "https://github.com/kubev2v/forklift"
  forklift-console-plugin: "https://github.com/kubev2v/forklift-console-plugin"
  forklift-must-gather: "https://github.com/kubev2v/forklift-must-gather"
  # forklift-int: "https://gitlab.cee.redhat.com/mtv/forklift" # don't use internal git because it needs auth

  # Raw mappings
raw_mappings:
  forklift: "https://raw.githubusercontent.com/kubev2v/forklift/refs/heads/{branc\
    h}/build/release.conf"
  forklift-console-plugin: "https://raw.githubusercontent.com/kubev2v/forklift-co\
    nsole-plugin/refs/heads/{branch}/build/release.conf"
  forklift-must-gather: "https://raw.githubusercontent.com/kubev2v/forklift-must-\
    gather/refs/heads/{branch}/build/release.conf"
  forklift-int: "https://gitlab.cee.redhat.com/mtv/forklift/-/raw/{branch}/build/\
    release.conf"

# Component mappings
# mapping key = Downstream name of the component (e.g. image repository in comet)
# upstream = Upstream name of the component (e.g. image repository in konflux)
# origin = git repository URL mappings (from "repositories" config setting)
cmp_mappings:
  mtv-controller-rhel9:
    upstream: "forklift-controller"
    origin: "forklift"

